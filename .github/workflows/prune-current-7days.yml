name: Enforce Rolling 7-Day Article Window

# Maintenance workflow: keep the persisted article feed on the exact KST rolling
# 7-day calendar window and align direct-script defaults with production.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prune-current-7days.yml"
      - "scripts/prune-rolling-article-window.mjs"

permissions:
  contents: write

concurrency:
  group: wr-articles-data-writer
  cancel-in-progress: false

jobs:
  prune:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip-prune]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Align direct-script defaults to 7 days
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';

          const edits = [
            {
              file: 'scripts/discover-priority-source-news.mjs',
              candidates: [
                'const LOOKBACK = Number(process.env.NEWS_DISCOVERY_DAYS || 14);',
                'const LOOKBACK = Number(process.env.NEWS_DISCOVERY_DAYS || 7);'
              ],
              target: 'const LOOKBACK = Number(process.env.NEWS_DISCOVERY_DAYS || 7);'
            },
            {
              file: 'scripts/fetch-arabic-content.mjs',
              candidates: [
                'const RETENTION_DAYS = Number(process.env.ARTICLE_RETENTION_DAYS || 30);',
                'const RETENTION_DAYS = Number(process.env.ARTICLE_RETENTION_DAYS || 14);',
                'const RETENTION_DAYS = Number(process.env.ARTICLE_RETENTION_DAYS || 7);'
              ],
              target: 'const RETENTION_DAYS = Number(process.env.ARTICLE_RETENTION_DAYS || 7);'
            }
          ];

          for (const edit of edits) {
            let text = await fs.readFile(edit.file, 'utf8');
            const current = edit.candidates.find((candidate) => text.includes(candidate));
            if (!current) throw new Error(`Expected retention default not found in ${edit.file}`);
            if (current !== edit.target) {
              text = text.replace(current, edit.target);
              await fs.writeFile(edit.file, text, 'utf8');
              console.log(`[defaults] updated: ${edit.file}`);
            } else {
              console.log(`[defaults] already aligned: ${edit.file}`);
            }
          }
          NODE

      - name: Check maintenance scripts
        run: |
          node --check scripts/discover-priority-source-news.mjs
          node --check scripts/fetch-arabic-content.mjs
          node --check scripts/prune-rolling-article-window.mjs

      - name: Keep only exact KST rolling 7-day persisted articles
        env:
          ARTICLE_RETENTION_DAYS: "7"
        run: node scripts/prune-rolling-article-window.mjs data/articles.json

      - name: Validate pruned article data
        run: npm run validate:data

      - name: Commit rolling 7-day maintenance changes
        run: |
          set -euo pipefail
          FILES=(
            data/articles.json
            scripts/discover-priority-source-news.mjs
            scripts/fetch-arabic-content.mjs
          )
          if git diff --quiet -- "${FILES[@]}"; then
            echo "No rolling-window changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${FILES[@]}"
          git commit -m "Enforce exact KST 7-day article window [skip-prune]"
          git pull --rebase origin main
          git push origin main
