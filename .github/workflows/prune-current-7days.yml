name: One-time Prune Articles To Current 7 Days

# One-time maintenance workflow: keep KST 2026-08-01 through 2026-08-07 only
# and align direct-script defaults with production: discover 7 days, retain 14 days.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prune-current-7days.yml"

permissions:
  contents: write

concurrency:
  group: wr-articles-data-writer
  cancel-in-progress: false

jobs:
  prune:
    if: ${{ !contains(github.event.head_commit.message, '[skip-prune]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Align script defaults to discover 7 days and retain 14 days
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';

          const edits = [
            {
              file: 'scripts/discover-priority-source-news.mjs',
              oldText: 'const LOOKBACK = Number(process.env.NEWS_DISCOVERY_DAYS || 14);',
              newText: 'const LOOKBACK = Number(process.env.NEWS_DISCOVERY_DAYS || 7);'
            },
            {
              file: 'scripts/fetch-arabic-content.mjs',
              oldText: 'const RETENTION_DAYS = Number(process.env.ARTICLE_RETENTION_DAYS || 30);',
              newText: 'const RETENTION_DAYS = Number(process.env.ARTICLE_RETENTION_DAYS || 14);'
            }
          ];

          for (const edit of edits) {
            let text = await fs.readFile(edit.file, 'utf8');
            if (text.includes(edit.newText)) {
              console.log(`[defaults] already aligned: ${edit.file}`);
              continue;
            }
            if (!text.includes(edit.oldText)) {
              throw new Error(`Expected default not found in ${edit.file}`);
            }
            text = text.replace(edit.oldText, edit.newText);
            await fs.writeFile(edit.file, text, 'utf8');
            console.log(`[defaults] updated: ${edit.file}`);
          }
          NODE

      - name: Check updated scripts
        run: |
          node --check scripts/discover-priority-source-news.mjs
          node --check scripts/fetch-arabic-content.mjs

      - name: Keep only 2026-08-01 through 2026-08-07 articles
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';

          const file = 'data/articles.json';
          const START = '2026-08-01';
          const END = '2026-08-07';

          function kstDateKey(value = '') {
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return '';
            const parts = new Intl.DateTimeFormat('en-CA', {
              timeZone: 'Asia/Seoul',
              year: 'numeric', month: '2-digit', day: '2-digit'
            }).formatToParts(date);
            const map = Object.fromEntries(parts.map((part) => [part.type, part.value]));
            return `${map.year}-${map.month}-${map.day}`;
          }

          const payload = JSON.parse(await fs.readFile(file, 'utf8'));
          const articles = Array.isArray(payload) ? payload : (payload.articles || []);
          const kept = [];
          const removed = [];

          for (const article of articles) {
            const rawDate = article.publishedAt || article.article?.publishedAt || '';
            const dateKey = kstDateKey(rawDate);
            if (dateKey && dateKey >= START && dateKey <= END) kept.push(article);
            else removed.push({ id: article.articleId || article.id || '', date: dateKey || 'INVALID', title: article.originalTitleArabic || '' });
          }

          const generatedAt = new Date().toISOString();
          const output = Array.isArray(payload)
            ? kept
            : {
                ...payload,
                generatedAt,
                count: kept.length,
                articles: kept,
                manualPrune: {
                  generatedAt,
                  timezone: 'Asia/Seoul',
                  periodStart: START,
                  periodEnd: END,
                  beforeCount: articles.length,
                  afterCount: kept.length,
                  removedCount: removed.length
                }
              };

          await fs.writeFile(file, `${JSON.stringify(output, null, 2)}\n`, 'utf8');
          console.log(`[prune-7days] period=${START}..${END} before=${articles.length} kept=${kept.length} removed=${removed.length}`);
          console.log(`[prune-7days] removed sample=${JSON.stringify(removed.slice(0, 10))}`);
          NODE

      - name: Validate pruned article data
        run: npm run validate:data

      - name: Commit maintenance changes
        run: |
          set -euo pipefail
          if git diff --quiet -- data/articles.json scripts/discover-priority-source-news.mjs scripts/fetch-arabic-content.mjs; then
            echo "No maintenance changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json scripts/discover-priority-source-news.mjs scripts/fetch-arabic-content.mjs
          git commit -m "Prune old articles and align news windows [skip-prune]"
          git pull --rebase origin main
          git push origin main
