name: Generate Weekly Report

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: wr-weekly-report-writer
  cancel-in-progress: false

jobs:
  generate:
    if: >-
      startsWith(github.event.issue.title, '[REPORT]') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Word and Opinet dependencies
        run: python -m pip install --disable-pip-version-check python-docx==1.2.0 requests==2.32.4 beautifulsoup4==4.13.4 lxml==5.4.0

      - name: Verify report-generation secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is not available."
            exit 1
          fi

      - name: Validate request, cluster similar articles, and prepare report input
        id: prepare
        env:
          REPORT_MAX_ARTICLES: "40"
          REPORT_SOURCE_MAX_CHARS: "18000"
          REPORT_TOTAL_SOURCE_MAX_CHARS: "240000"
        run: node scripts/prepare-report-request.mjs

      - name: Correct direct-Iraq international categories before report editing
        run: npm run report:category-routing

      - name: Fetch D-2 and D-1 crude prices from Opinet
        run: python scripts/fetch-opinet-crude.py --request work/report-request.json --output work/oil-prices.json

      - name: Edit selected article clusters with advanced AI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPORT_MODEL: ${{ vars.REPORT_MODEL || 'gpt-5.1' }}
          REPORT_MODEL_FALLBACKS: ${{ vars.REPORT_MODEL_FALLBACKS || 'gpt-5,gpt-4.1' }}
          REPORT_REASONING: ${{ vars.REPORT_REASONING || 'high' }}
          REPORT_AI_TIMEOUT_MS: "300000"
          REPORT_MAX_OUTPUT_TOKENS: "14000"
        run: npm run report:ai

      - name: Build fixed Word template
        run: python scripts/build-weekly-report-template.py --output templates/weekly-report-template.docx

      - name: Render final Word report from fixed template
        run: python scripts/render-weekly-report.py --template templates/weekly-report-template.docx --content work/report-content.json --output work/weekly-report.docx

      - name: Validate grouping, category order, chronology, tables, and prices
        run: python scripts/validate-weekly-report.py --docx work/weekly-report.docx --content work/report-content.json --metadata work/report-metadata.json

      - name: Upload validated report artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ steps.prepare.outputs.report_date }}
          path: |
            work/weekly-report.docx
            work/report-metadata.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish only after every validation passes
        env:
          REPORT_DATE: ${{ steps.prepare.outputs.report_date }}
          REPORT_FILENAME: ${{ steps.prepare.outputs.report_filename }}
        run: |
          set -euo pipefail
          YEAR="${REPORT_DATE%%-*}"
          MONTH="$(printf '%02d' "$((10#${REPORT_DATE:5:2}))")"
          TARGET_DIR="reports/generated/${YEAR}/${MONTH}"
          mkdir -p "$TARGET_DIR"
          cp work/weekly-report.docx "$TARGET_DIR/$REPORT_FILENAME"
          cp work/report-metadata.json "$TARGET_DIR/${REPORT_DATE}.json"
          cp work/weekly-report.docx reports/latest.docx
          cp work/report-metadata.json reports/latest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest.docx reports/latest.json "$TARGET_DIR/$REPORT_FILENAME" "$TARGET_DIR/${REPORT_DATE}.json"
          if git diff --cached --quiet; then
            echo "No report changes to commit"
            exit 0
          fi
          git commit -m "Generate Iraq weekly report for ${REPORT_DATE}"
          git pull --rebase origin main
          git push origin main

      - name: Comment download link and close request
        uses: actions/github-script@v7
        with:
          script: |
            const reportDate = '${{ steps.prepare.outputs.report_date }}';
            const count = '${{ steps.prepare.outputs.selected_count }}';
            const clusters = '${{ steps.prepare.outputs.cluster_count }}';
            const pagesUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/reports/latest.docx`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `주간상황보고서 생성이 완료됐습니다.\n\n- 보고일: ${reportDate}\n- 선택 기사: ${count}건\n- 통합 주제: ${clusters}건\n- [Word 보고서 다운로드](${pagesUrl})\n\n유사기사 통합, 카테고리 배치, 시간순 배열과 문서 검증을 통과한 파일만 reports/latest.docx로 교체됩니다.`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });

      - name: Comment failure without replacing the last good report
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `보고서 생성이 중단됐습니다. 기존 정상 보고서는 교체하지 않았습니다.\n\n[실행 로그 확인](${runUrl})`
            });
