name: Re-score Article Importance

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rescore-importance.yml"
      - "scripts/importance-business-rules.mjs"
      - "scripts/importance-ai.mjs"
      - "scripts/apply-business-importance-floor.mjs"
      - "scripts/score-article-importance.mjs"
      - "scripts/prepare-importance-scoring.mjs"
      - "package.json"

permissions:
  contents: write

concurrency:
  group: collect-arabic-news
  cancel-in-progress: false

jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Normalize fields for importance scoring
        run: npm run collect:importance-prepare

      - name: Calculate category rule scores
        run: npm run collect:importance

      - name: Evaluate Bismayah business importance
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMPORTANCE_AI_ENABLED: "true"
          IMPORTANCE_MODEL: "gpt-5.4-mini"
          IMPORTANCE_AI_BATCH_SIZE: "8"
          IMPORTANCE_AI_MAX_ARTICLES: "40"
        run: npm run collect:importance-business

      - name: Validate data
        run: npm run validate:data

      - name: Commit updated importance scores
        run: |
          if git diff --quiet -- data/articles.json; then
            echo "No importance score changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          git commit -m "Re-score article importance for Bismayah business"
          git pull --rebase origin main
          git push origin main
