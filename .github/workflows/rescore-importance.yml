name: Re-score Article Importance

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rescore-importance.yml"
      - "scripts/group-duplicate-events.mjs"
      - "scripts/importance-business-rules.mjs"
      - "scripts/importance-category-rules.mjs"
      - "scripts/importance-ai.mjs"
      - "scripts/apply-business-importance-floor.mjs"
      - "scripts/score-article-importance.mjs"
      - "scripts/prepare-importance-scoring.mjs"
      - "scripts/test-category-importance-scoring.mjs"
      - "package.json"

permissions:
  contents: write

concurrency:
  group: collect-arabic-news
  cancel-in-progress: false

jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify OpenAI API secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is not available as an Actions secret for sultjung/WR. Store it under repository Settings > Secrets and variables > Actions > Repository secrets. If it is an Environment secret, assign that environment to this job."
            exit 1
          fi
          echo "OPENAI_API_KEY is available to the workflow."

      - name: Test category-relative importance rules
        run: npm run test:importance-category

      - name: Regroup existing articles into related news
        env:
          EVENT_GROUP_MAX_HOURS: "72"
          EVENT_GROUP_MIN_SCORE: "0.50"
        run: npm run collect:events

      - name: Normalize fields for importance scoring
        run: npm run collect:importance-prepare

      - name: Calculate category rule scores
        run: npm run collect:importance

      - name: Evaluate importance within each category with AI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMPORTANCE_AI_ENABLED: "true"
          IMPORTANCE_AI_REQUIRED: "true"
          IMPORTANCE_MODEL: ${{ vars.IMPORTANCE_MODEL || 'gpt-4.1-mini' }}
          IMPORTANCE_MODEL_FALLBACKS: "gpt-4o-mini"
          IMPORTANCE_AI_BATCH_SIZE: "6"
          IMPORTANCE_AI_MAX_ARTICLES: "120"
          IMPORTANCE_AI_TIMEOUT_MS: "60000"
        run: npm run collect:importance-business

      - name: Validate data
        run: npm run validate:data

      - name: Commit updated grouping and importance scores
        run: |
          if git diff --quiet -- data/articles.json data/event-groups.json; then
            echo "No grouping or importance score changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json data/event-groups.json
          git commit -m "Regroup related news and re-score article importance"
          git pull --rebase origin main
          git push origin main
