name: Recheck Current News Relevance

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recheck-current-news.yml
      - scripts/enforce-iraq-scope.mjs
      - scripts/test-enforce-iraq-scope.mjs
      - package.json
  schedule:
    - cron: "30 5 * * *" # temporary audit run at 14:30 KST

permissions:
  contents: write

concurrency:
  group: collect-arabic-news
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore candidates removed by the first audit pass
        env:
          RELEVANCE_BASELINE_COMMIT: "e26506e3085a7f4d886708dcf7e55f78297b022c"
          BASE_ARTICLES_FILE: "/tmp/pre-relevance-audit-articles.json"
        run: |
          git show "${RELEVANCE_BASELINE_COMMIT}:data/articles.json" > "$BASE_ARTICLES_FILE"
          node scripts/restore-relevance-candidates.mjs

      - name: Test relevance and duplicate-event guards
        run: npm test

      - name: Enforce exact Iraq scope for security news
        run: npm run collect:iraq-scope

      - name: Reapply strict Iraq relevance gate
        run: npm run collect:strict-gate

      - name: Rebuild related-news groups
        env:
          EVENT_GROUP_MAX_HOURS: "72"
          EVENT_GROUP_MIN_SCORE: "0.50"
        run: npm run collect:events

      - name: Validate rechecked data
        run: npm run validate:data

      - name: Commit rechecked data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- data/
          if git diff --cached --quiet; then
            echo "No relevance changes"
            exit 0
          fi
          git commit -m "Recheck current news relevance and duplicate groups"
          git pull --rebase origin main
          git push origin main
