name: Recheck Current News Relevance

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recheck-current-news.yml
      - scripts/strict-category-gate.mjs
      - scripts/test-strict-category-gate.mjs
      - scripts/group-duplicate-events.mjs
      - scripts/test-group-duplicate-events.mjs
      - package.json

permissions:
  contents: write

concurrency:
  group: collect-arabic-news
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test relevance and duplicate-event guards
        run: npm test

      - name: Reapply strict Iraq relevance gate
        run: npm run collect:strict-gate

      - name: Rebuild related-news groups
        env:
          EVENT_GROUP_MAX_HOURS: "72"
          EVENT_GROUP_MIN_SCORE: "0.50"
        run: npm run collect:events

      - name: Validate rechecked data
        run: npm run validate:data

      - name: Commit rechecked data
        run: |
          if git diff --quiet -- data/*.json; then
            echo "No relevance changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git commit -m "Recheck current news relevance and duplicate groups"
          git pull --rebase origin main
          git push origin main
