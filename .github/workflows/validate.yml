name: Validate WR Project

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: wr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run validate
