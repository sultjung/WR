name: Collect Arabic News

on:
  workflow_dispatch:
  schedule:
    - cron: "20 21 * * *" # 06:20 KST
    - cron: "30 3 * * *"  # 12:30 KST

permissions:
  contents: write

concurrency:
  group: wr-articles-data-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify OpenAI API secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is not available as an Actions secret for sultjung/WR."
            exit 1
          fi
          echo "OPENAI_API_KEY is available to the workflow."

      - name: Validate configuration
        run: npm run validate:config

      - name: Test relevance, category routing, grouping, cards, and translation terms
        run: npm test

      - name: Discover broad Arabic news candidates with Google News
        env:
          COLLECT_CATEGORIES: "bismayah,politics,economy,security,international"
          NEWS_DISCOVERY_DAYS: "14"
          MAX_PER_QUERY: "30"
          FETCH_TIMEOUT_MS: "15000"
          DISCOVERY_CONCURRENCY: "4"
        run: npm run collect:discover

      - name: Recover publisher URLs from Iraqi source indexes
        env:
          SOURCE_INDEX_TIMEOUT_MS: "15000"
          SOURCE_INDEX_CONCURRENCY: "3"
          MAX_SOURCE_INDEX_ENDPOINTS: "6"
          MAX_SOURCE_INDEX_ITEMS: "1200"
          MIN_TITLE_SIMILARITY: "0.54"
        run: npm run collect:recover

      - name: Verify recovered and fallback article URLs
        env:
          URL_RESOLVE_TIMEOUT_MS: "15000"
          URL_RESOLVE_CONCURRENCY: "4"
        run: npm run collect:resolve

      - name: Snapshot processed article state
        run: npm run collect:incremental-prepare

      - name: Fetch and validate Arabic full text
        env:
          CONTENT_FETCH_TIMEOUT_MS: "18000"
          CONTENT_FETCH_CONCURRENCY: "3"
          MIN_ARABIC_CONTENT_CHARS: "300"
          MIN_ARABIC_RATIO: "0.35"
          ARTICLE_RETENTION_DAYS: "30"
        run: npm run collect:content

      - name: Repair invalid and metadata-based article titles
        run: npm run collect:title-fix

      - name: Preserve unchanged facts, cards, translations, analysis, and related titles
        run: npm run collect:incremental-preserve

      - name: Enforce exact Iraq scope before classification and scoring
        run: npm run collect:iraq-scope

      - name: Apply strict Iraq category gate
        run: npm run collect:strict-gate

      - name: Route direct-Iraq international articles into politics, economy, or security
        run: npm run collect:direct-iraq-routing

      - name: Group duplicate reports into related news
        env:
          EVENT_GROUP_MAX_HOURS: "72"
          EVENT_GROUP_MIN_SCORE: "0.50"
        run: npm run collect:events

      - name: Normalize fields for importance scoring
        run: npm run collect:importance-prepare

      - name: Calculate category rule scores
        run: npm run collect:importance

      - name: Evaluate importance within each category with AI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMPORTANCE_AI_ENABLED: "true"
          IMPORTANCE_AI_REQUIRED: "true"
          IMPORTANCE_MODEL: ${{ vars.IMPORTANCE_MODEL || 'gpt-4.1-mini' }}
          IMPORTANCE_MODEL_FALLBACKS: "gpt-4o-mini"
          IMPORTANCE_AI_BATCH_SIZE: "6"
          IMPORTANCE_AI_MAX_ARTICLES: "80"
          IMPORTANCE_AI_TIMEOUT_MS: "60000"
        run: npm run collect:importance-business

      - name: Extract Arabic facts then create Korean article cards
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CARD_AI_REQUIRED: "true"
          CARD_FACT_MODEL: ${{ vars.CARD_FACT_MODEL || 'gpt-4.1-mini' }}
          CARD_KO_MODEL: ${{ vars.CARD_KO_MODEL || 'gpt-4.1-mini' }}
          CARD_MODEL_FALLBACKS: "gpt-4o-mini"
          CARD_AI_BATCH_SIZE: "3"
          CARD_AI_MAX_ARTICLES: "60"
          CARD_SOURCE_MAX_CHARS: "16000"
          CARD_AI_TIMEOUT_MS: "90000"
          CARD_AI_RETRY_ATTEMPTS: "2"
        run: npm run collect:cards

      - name: Translate duplicate-article titles into Korean
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RELATED_TITLE_AI_REQUIRED: "true"
          RELATED_TITLE_MODEL: ${{ vars.RELATED_TITLE_MODEL || vars.CARD_KO_MODEL || 'gpt-4.1-mini' }}
          RELATED_TITLE_MODEL_FALLBACKS: "gpt-4o-mini"
          RELATED_TITLE_AI_BATCH_SIZE: "8"
          RELATED_TITLE_MAX_ARTICLES: "300"
          RELATED_TITLE_AI_RETRY_ATTEMPTS: "2"
          CARD_AI_TIMEOUT_MS: "90000"
        run: npm run collect:related-titles

      - name: Audit foreign-local leakage
        run: npm run audit:foreign-local

      - name: Validate collected data and article cards
        run: npm run validate:data

      - name: Commit collected data
        run: |
          if git diff --quiet -- data/articles.json; then
            echo "No collected article changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          git commit -m "Collect, score, and summarize Iraqi Arabic news"
          git pull --rebase origin main
          git push origin main
