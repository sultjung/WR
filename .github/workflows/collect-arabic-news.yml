name: Collect Arabic News

on:
  workflow_dispatch:
  schedule:
    - cron: "20 21 * * *" # 06:20 KST
    - cron: "30 3 * * *"  # 12:30 KST

permissions:
  contents: write

concurrency:
  group: wr-articles-data-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify OpenAI API secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is not available as an Actions secret for sultjung/WR."
            exit 1
          fi
          echo "OPENAI_API_KEY is available to the workflow."

      - name: Validate configuration
        run: npm run validate:config

      - name: Validate full-translation frontend and scripts
        run: npm run validate:frontend

      - name: Test relevance, category routing, grouping, importance, and translation terms
        run: npm test

      - name: Discover broad Arabic news candidates with Google News
        env:
          COLLECT_CATEGORIES: "bismayah,politics,economy,security,international"
          NEWS_DISCOVERY_DAYS: "14"
          MAX_PER_QUERY: "30"
          FETCH_TIMEOUT_MS: "15000"
          DISCOVERY_CONCURRENCY: "4"
        run: npm run collect:discover

      - name: Recover publisher URLs from Iraqi source indexes
        env:
          SOURCE_INDEX_TIMEOUT_MS: "15000"
          SOURCE_INDEX_CONCURRENCY: "3"
          MAX_SOURCE_INDEX_ENDPOINTS: "6"
          MAX_SOURCE_INDEX_ITEMS: "1200"
          MIN_TITLE_SIMILARITY: "0.54"
        run: npm run collect:recover

      - name: Discover NIC and Bismayah priority sources directly
        env:
          PRIORITY_DISCOVERY_TIMEOUT_MS: "18000"
          PRIORITY_DISCOVERY_MAX_DETAIL_FETCHES: "60"
          NEWS_DISCOVERY_DAYS: "14"
        run: npm run collect:priority-discovery

      - name: Verify recovered and fallback article URLs
        env:
          URL_RESOLVE_TIMEOUT_MS: "15000"
          URL_RESOLVE_CONCURRENCY: "4"
        run: npm run collect:resolve

      - name: Preserve priority aggregator fallback URLs
        run: npm run collect:priority-aggregator-fallback

      - name: Enforce exact KST rolling 14-day window before processing
        env:
          ARTICLE_RETENTION_DAYS: "14"
        run: node scripts/prune-rolling-article-window.mjs

      - name: Snapshot processed article state
        run: npm run collect:incremental-prepare

      - name: Fetch and validate Arabic full text
        env:
          CONTENT_FETCH_TIMEOUT_MS: "18000"
          CONTENT_FETCH_CONCURRENCY: "3"
          MIN_ARABIC_CONTENT_CHARS: "30"
          MIN_ARABIC_RATIO: "0.35"
          ARTICLE_RETENTION_DAYS: "14"
        run: npm run collect:content

      - name: Re-enforce exact KST 14-day window on final articles
        env:
          ARTICLE_RETENTION_DAYS: "14"
        run: node scripts/prune-rolling-article-window.mjs data/articles.json

      - name: Repair invalid and metadata-based article titles
        run: npm run collect:title-fix

      - name: Preserve unchanged translations, analysis, importance, and related titles
        run: npm run collect:incremental-preserve

      - name: Enforce exact Iraq scope before classification and scoring
        run: npm run collect:iraq-scope

      - name: Apply strict Iraq category gate
        run: npm run collect:strict-gate

      - name: Route direct-Iraq international articles into politics, economy, or security
        run: npm run collect:direct-iraq-routing

      - name: Group duplicate reports into related news
        env:
          EVENT_GROUP_MAX_HOURS: "72"
          EVENT_GROUP_MIN_SCORE: "0.50"
        run: npm run collect:events

      - name: Normalize fields for importance scoring
        run: npm run collect:importance-prepare

      - name: Calculate category rule scores
        run: npm run collect:importance

      - name: Restore reusable AI results from checkpoint
        env:
          AI_CHECKPOINT_FILE: ${{ runner.temp }}/wr-ai-checkpoint.json
        run: |
          if git show origin/automation/ai-checkpoint:data/articles.json > "$AI_CHECKPOINT_FILE" 2>/dev/null; then
            npm run collect:restore-ai-checkpoint
          else
            echo "No AI checkpoint is available yet"
          fi

      - name: Evaluate importance within each category with AI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMPORTANCE_AI_ENABLED: "true"
          IMPORTANCE_AI_REQUIRED: "false"
          IMPORTANCE_MODEL: ${{ vars.IMPORTANCE_MODEL || 'gpt-5.6-luna' }}
          IMPORTANCE_MODEL_FALLBACKS: "gpt-4.1-mini,gpt-4o-mini"
          IMPORTANCE_AI_BATCH_SIZE: "10"
          IMPORTANCE_AI_MAX_ARTICLES: "40"
          IMPORTANCE_AI_TIMEOUT_MS: "60000"
        run: npm run collect:importance-business

      - name: Translate Arabic titles and full article text into Korean
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRANSLATION_AI_REQUIRED: "true"
          TRANSLATION_MODEL: "gpt-5.6-luna"
          TRANSLATION_MODEL_FALLBACKS: "gpt-4.1-mini,gpt-4o-mini"
          TRANSLATION_AI_MAX_ARTICLES: "200"
          TRANSLATION_CONCURRENCY: "6"
          TRANSLATION_AI_TIMEOUT_MS: "120000"
          TRANSLATION_AI_RETRY_ATTEMPTS: "2"
        run: npm run collect:translations

      - name: Translate duplicate-article titles into Korean
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RELATED_TITLE_AI_REQUIRED: "true"
          RELATED_TITLE_MODEL: "gpt-5.6-luna"
          RELATED_TITLE_MODEL_FALLBACKS: "gpt-4.1-mini,gpt-4o-mini"
          RELATED_TITLE_AI_BATCH_SIZE: "8"
          RELATED_TITLE_MAX_ARTICLES: "300"
          RELATED_TITLE_AI_RETRY_ATTEMPTS: "2"
          CARD_AI_TIMEOUT_MS: "90000"
        run: npm run collect:related-titles

      - name: Save AI results checkpoint
        run: |
          checkpoint_dir="$(mktemp -d)"
          if git show-ref --verify --quiet refs/remotes/origin/automation/ai-checkpoint; then
            git worktree add -B automation/ai-checkpoint "$checkpoint_dir" origin/automation/ai-checkpoint
          else
            git worktree add -b automation/ai-checkpoint "$checkpoint_dir" HEAD
          fi
          cp data/articles.json "$checkpoint_dir/data/articles.json"
          git -C "$checkpoint_dir" config user.name "github-actions[bot]"
          git -C "$checkpoint_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$checkpoint_dir" add data/articles.json
          if git -C "$checkpoint_dir" diff --cached --quiet; then
            echo "AI checkpoint is already current"
          else
            git -C "$checkpoint_dir" commit -m "Checkpoint AI-scored and translated articles"
            git -C "$checkpoint_dir" push origin HEAD:automation/ai-checkpoint
          fi
          git worktree remove "$checkpoint_dir" --force

      - name: Audit foreign-local leakage
        run: npm run audit:foreign-local

      - name: Validate collected data and full translations
        env:
          MIN_ARABIC_CONTENT_CHARS: "30"
          MIN_ARABIC_RATIO: "0.35"
        run: npm run validate:data

      - name: Commit collected data
        run: |
          if [ -z "$(git status --porcelain -- data/articles.json data/archive)" ]; then
            echo "No collected article changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json data/archive
          git commit -m "Collect, score, and translate Iraqi Arabic news"
          git pull --rebase origin main
          git push origin main
