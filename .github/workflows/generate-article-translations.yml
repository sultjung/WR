name: Generate Full Article Translations

on:
  workflow_dispatch:
    inputs:
      max_articles:
        description: Maximum uncached representative articles to translate
        required: false
        default: "40"
      max_related_titles:
        description: Maximum uncached duplicate-article titles to translate
        required: false
        default: "300"

permissions:
  contents: write

concurrency:
  group: wr-articles-data-writer
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify OpenAI API secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is not available."
            exit 1
          fi

      - name: Test news relevance and translation rules
        run: npm test

      - name: Translate Arabic titles and full article text into Korean
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRANSLATION_AI_REQUIRED: "true"
          TRANSLATION_MODEL: ${{ vars.TRANSLATION_MODEL || 'gpt-4.1-mini' }}
          TRANSLATION_MODEL_FALLBACKS: "gpt-4o-mini"
          TRANSLATION_AI_MAX_ARTICLES: ${{ inputs.max_articles || '40' }}
          TRANSLATION_CHUNK_CHARS: "7000"
          TRANSLATION_AI_TIMEOUT_MS: "120000"
          TRANSLATION_AI_RETRY_ATTEMPTS: "2"
        run: npm run collect:translations

      - name: Translate duplicate-article titles into Korean
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RELATED_TITLE_AI_REQUIRED: "true"
          RELATED_TITLE_MODEL: ${{ vars.RELATED_TITLE_MODEL || vars.TRANSLATION_MODEL || 'gpt-4.1-mini' }}
          RELATED_TITLE_MODEL_FALLBACKS: "gpt-4o-mini"
          RELATED_TITLE_AI_BATCH_SIZE: "8"
          RELATED_TITLE_MAX_ARTICLES: ${{ inputs.max_related_titles || '300' }}
          RELATED_TITLE_AI_RETRY_ATTEMPTS: "2"
          CARD_AI_TIMEOUT_MS: "90000"
        run: npm run collect:related-titles

      - name: Validate full translations and related titles
        run: npm run validate:translations

      - name: Commit translated articles
        run: |
          if git diff --quiet -- data/articles.json; then
            echo "No translation changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          git commit -m "Translate Iraqi news articles in full"
          git pull --rebase origin main
          git push origin main
