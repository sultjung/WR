<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="이라크·비스마야 사업 관련 아랍어 현지뉴스 검토 및 주간상황보고서 작성 지원">
  <title>이라크 주간상황보고서</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./importance-colors.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <p class="eyebrow">IRAQ WEEKLY INTELLIGENCE</p>
        <h1>이라크 주간상황보고서</h1>
        <p class="subtitle">비스마야 사업 관련 아랍어 현지뉴스 검토 및 보고서 작성 지원</p>
      </div>
      <div class="header-status">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="updatedAt">데이터 준비 중</span>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <section class="summary-grid" aria-label="카테고리 현황">
      <button class="summary-card active" data-filter="all"><span>전체 기사</span><strong id="countAll">0</strong></button>
      <button class="summary-card" data-filter="bismayah"><span>비스마야</span><strong id="countBismayah">0</strong></button>
      <button class="summary-card" data-filter="politics"><span>정치권 동향</span><strong id="countPolitics">0</strong></button>
      <button class="summary-card" data-filter="economy"><span>경제·건설</span><strong id="countEconomy">0</strong></button>
      <button class="summary-card" data-filter="security"><span>테러·치안</span><strong id="countSecurity">0</strong></button>
      <button class="summary-card" data-filter="international"><span>국제사회</span><strong id="countInternational">0</strong></button>
      <button class="summary-card" data-filter="selected"><span>보고서 선택</span><strong id="countSelected">0</strong></button>
    </section>

    <section class="report-builder" aria-labelledby="reportBuilderTitle">
      <div class="report-builder-copy">
        <p class="report-kicker">FINAL REPORT</p>
        <h2 id="reportBuilderTitle">주간상황보고서 생성</h2>
        <p>선택한 기사만 고급 AI가 실제 보고서 문체로 재편집하고, 오피넷의 보고일 전일·전전일 국제유가를 반영해 Word 파일을 생성합니다.</p>
      </div>
      <div class="report-builder-controls">
        <label>보고일
          <input id="reportDate" type="date">
        </label>
        <label>보고기간 시작
          <input id="reportStartDate" type="date">
        </label>
        <label>보고기간 종료
          <input id="reportEndDate" type="date">
        </label>
        <button id="requestReport" class="report-button" type="button">선택 기사로 보고서 생성</button>
        <a id="latestReportLink" class="latest-report-link" href="./reports/latest.docx" target="_blank" rel="noopener" hidden>최근 생성 보고서 다운로드</a>
      </div>
      <p id="reportRequestMessage" class="report-request-message" aria-live="polite"></p>
    </section>

    <section class="toolbar" aria-label="기사 필터">
      <label>시작일
        <input id="startDate" type="date">
      </label>
      <label>종료일
        <input id="endDate" type="date">
      </label>
      <label>정렬
        <select id="sortOrder">
          <option value="importance-desc" selected>중요도 높은순</option>
          <option value="importance-asc">중요도 낮은순</option>
          <option value="newest">최신순</option>
          <option value="oldest">오래된순</option>
        </select>
      </label>
      <label>중요도 점수
        <select id="importanceFilter">
          <option value="all">전체</option>
          <option value="90-100">90점 이상</option>
          <option value="80-89">80~89점</option>
          <option value="70-79">70~79점</option>
          <option value="60-69">60~69점</option>
          <option value="40-59">40~59점</option>
          <option value="0-39">40점 미만</option>
          <option value="pending">평가 대기</option>
        </select>
      </label>
      <label>원문 상태
        <select id="sourceFilter">
          <option value="all">전체</option>
          <option value="ready">원문 확보</option>
          <option value="failed">확보 실패</option>
        </select>
      </label>
      <label>카드 요약 상태
        <select id="translationFilter">
          <option value="all">전체</option>
          <option value="completed">요약 완료</option>
          <option value="pending">요약 대기</option>
        </select>
      </label>
      <label class="search-field">검색
        <input id="searchInput" type="search" placeholder="아랍어·한국어 제목, 언론사 검색">
      </label>
      <button id="resetFilters" class="secondary-button" type="button">필터 초기화</button>
    </section>

    <section class="content-head">
      <div>
        <h2>수집 기사 검토</h2>
        <p>아랍어 원문에서 먼저 추출한 핵심 사실을 한국어 카드 요약으로 확인한 뒤 보고서 반영 여부를 선택합니다.</p>
      </div>
      <span id="visibleCount" class="result-count">0건 표시</span>
    </section>

    <section id="newsList" class="news-list empty" aria-live="polite">
      수집된 기사가 없습니다.
    </section>
  </main>

  <script src="./importance-fallback.js"></script>
  <script src="./app.js"></script>
  <script src="./importance-badge-colors.js"></script>
</body>
</html>
