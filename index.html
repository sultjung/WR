<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="이라크·비스마야 사업 관련 아랍어 현지뉴스 검토 및 주간상황보고서 작성 지원">
  <title>이라크 주간상황보고서</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <p class="eyebrow">IRAQ WEEKLY INTELLIGENCE</p>
        <h1>이라크 주간상황보고서</h1>
        <p class="subtitle">비스마야 사업 관련 아랍어 현지뉴스 검토 및 보고서 작성 지원</p>
      </div>
      <div class="header-status">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="updatedAt">데이터 준비 중</span>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <section class="summary-grid" aria-label="카테고리 현황">
      <button class="summary-card active" data-filter="all"><span>전체 기사</span><strong id="countAll">0</strong></button>
      <button class="summary-card" data-filter="bismayah"><span>비스마야</span><strong id="countBismayah">0</strong></button>
      <button class="summary-card" data-filter="politics"><span>정치권 동향</span><strong id="countPolitics">0</strong></button>
      <button class="summary-card" data-filter="economy"><span>경제·건설</span><strong id="countEconomy">0</strong></button>
      <button class="summary-card" data-filter="security"><span>테러·치안</span><strong id="countSecurity">0</strong></button>
      <button class="summary-card" data-filter="international"><span>국제사회</span><strong id="countInternational">0</strong></button>
      <button class="summary-card" data-filter="selected"><span>보고서 선택</span><strong id="countSelected">0</strong></button>
    </section>

    <section class="toolbar" aria-label="기사 필터">
      <label>보고기간
        <select id="periodFilter">
          <option value="7">최근 7일</option>
          <option value="14" selected>최근 14일</option>
          <option value="30">최근 30일</option>
          <option value="all">전체</option>
        </select>
      </label>
      <label>정렬
        <select id="sortOrder">
          <option value="newest" selected>최신순</option>
          <option value="oldest">오래된순</option>
        </select>
      </label>
      <label>원문 상태
        <select id="sourceFilter">
          <option value="all">전체</option>
          <option value="ready">원문 확보</option>
          <option value="failed">확보 실패</option>
        </select>
      </label>
      <label>번역 상태
        <select id="translationFilter">
          <option value="all">전체</option>
          <option value="completed">번역 완료</option>
          <option value="pending">번역 대기</option>
        </select>
      </label>
      <label class="search-field">검색
        <input id="searchInput" type="search" placeholder="아랍어·한국어 제목, 언론사 검색">
      </label>
      <button id="resetFilters" class="secondary-button" type="button">필터 초기화</button>
    </section>

    <section class="content-head">
      <div>
        <h2>수집 기사 검토</h2>
        <p>원문과 번역을 확인한 뒤 보고서 반영 여부를 선택합니다.</p>
      </div>
      <span id="visibleCount" class="result-count">0건 표시</span>
    </section>

    <section id="newsList" class="news-list empty" aria-live="polite">
      수집된 기사가 없습니다. 다음 단계에서 비스마야 직접 관련 아랍어 뉴스 수집기를 연결합니다.
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
