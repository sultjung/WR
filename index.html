<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="이라크·비스마야 사업 관련 아랍어 현지뉴스 자동수집, 한국어 전문번역 및 선별 기사 Word 다운로드">
  <title>이라크 주간상황보고서 뉴스자료</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./importance-colors.css">
  <link rel="stylesheet" href="./reader-mode.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <p class="eyebrow">Iraq Weekly Report</p>
        <h1>이라크 주간 종합상황보고 뉴스자료</h1>
        <p class="subtitle">비스마야 사업 관련 현지뉴스 자동수집 · 번역 · 분석 · 보고서용 기사 선별 목적</p>
      </div>
      <div class="header-status">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="updatedAt">데이터 준비 중</span>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <section class="summary-grid" aria-label="카테고리 현황">
      <button class="summary-card active" data-filter="all"><span>전체 기사</span><strong id="countAll">0</strong></button>
      <button class="summary-card" data-filter="bismayah"><span>비스마야</span><strong id="countBismayah">0</strong></button>
      <button class="summary-card" data-filter="politics"><span>정치권 동향</span><strong id="countPolitics">0</strong></button>
      <button class="summary-card" data-filter="economy"><span>경제·건설</span><strong id="countEconomy">0</strong></button>
      <button class="summary-card" data-filter="security"><span>테러·치안</span><strong id="countSecurity">0</strong></button>
      <button class="summary-card" data-filter="international"><span>국제사회</span><strong id="countInternational">0</strong></button>
      <button class="summary-card" data-filter="selected"><span>선택 기사</span><strong id="countSelected">0</strong></button>
    </section>

    <details class="report-builder-shell">
      <summary class="report-builder-summary">
        <span class="report-summary-kicker">GPT SOURCE</span>
        <strong id="sourceDownloadTitle">선택 기사 Word 다운로드</strong>
        <span class="report-summary-toggle" aria-hidden="true"></span>
      </summary>
      <section class="report-builder" aria-labelledby="sourceDownloadTitle">
      <div class="report-builder-copy">
        <p>보고일 기준 7일의 기사 중 필요한 기사만 선택해 주간상황보고서 GPT에 바로 업로드할 수 있는 Word 자료집으로 내려받습니다. 사이트에서는 최종 보고서를 생성하지 않습니다.</p>
        <div class="download-panel-status">
          <span id="selectedDownloadCount" class="selection-count-pill">0건 선택</span>
          <span class="download-note">Word에는 한국어 전문번역과 아랍어 원문을 함께 저장합니다.</span>
        </div>
      </div>
      <div class="report-builder-controls">
        <label>대상기간 시작
          <input id="reportStartDate" type="date" readonly aria-readonly="true" title="보고일 기준 7일 전으로 자동 설정됩니다.">
        </label>
        <label>대상기간 종료
          <input id="reportEndDate" type="date" readonly aria-readonly="true" title="보고일 기준 1일 전으로 자동 설정됩니다.">
        </label>
        <label>보고일
          <input id="reportDate" type="date">
        </label>
        <div class="download-actions">
          <button id="downloadSelected" class="report-button" type="button">선택 기사 Word 다운로드</button>
          <button id="clearSelected" class="secondary-button" type="button">선택 초기화</button>
        </div>
      </div>
      <p id="downloadMessage" class="report-request-message" aria-live="polite"></p>
      </section>
    </details>

    <section class="toolbar" aria-label="기사 필터">
      <label>시작일
        <input id="startDate" type="date">
      </label>
      <label>종료일
        <input id="endDate" type="date">
      </label>
      <label>정렬
        <select id="sortOrder">
          <option value="importance-desc" selected>중요도 높은순</option>
          <option value="importance-asc">중요도 낮은순</option>
          <option value="newest">최신순</option>
          <option value="oldest">오래된순</option>
        </select>
      </label>
      <label>중요도 점수
        <select id="importanceFilter">
          <option value="all">전체</option>
          <option value="5-5">★★★★★ 5.0</option>
          <option value="4-4.5">★★★★ 4.0~4.5</option>
          <option value="3-3.5">★★★ 3.0~3.5</option>
          <option value="2-2.5">★★ 2.0~2.5</option>
          <option value="1-1.5">★ 1.0~1.5</option>
          <option value="0.5-0.5">0.5</option>
          <option value="pending">평가 대기</option>
        </select>
      </label>
      <label>원문 상태
        <select id="sourceFilter">
          <option value="all">전체</option>
          <option value="ready">원문 확보</option>
          <option value="failed">확보 실패</option>
        </select>
      </label>
      <label>전문 번역 상태
        <select id="translationFilter">
          <option value="all">전체</option>
          <option value="completed">번역 완료</option>
          <option value="pending">번역 대기</option>
        </select>
      </label>
      <label class="search-field">검색
        <input id="searchInput" type="search" placeholder="한국어·아랍어 제목, 본문, 언론사 검색">
      </label>
      <button id="resetFilters" class="secondary-button" type="button">필터 초기화</button>
    </section>

    <section id="newsList" class="news-list empty" aria-live="polite">
      수집된 기사가 없습니다.
    </section>
  </main>

  <button id="scrollTopButton" class="scroll-top-button" type="button" aria-label="페이지 맨 위로 이동" aria-hidden="true">
    <span aria-hidden="true">↑</span>
    <span>맨 위로</span>
  </button>

  <script src="./importance-fallback.js"></script>
  <script src="./translation-pipeline-guard.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="./app.js"></script>
  <script src="./importance-badge-colors.js"></script>
</body>
</html>
